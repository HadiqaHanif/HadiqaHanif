name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"   # har 12 ghante mein chalega
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate pacman contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: HadiqaHanif
          outputs: |
            dist/pacman-contribution-graph.svg?palette=github-dark
            dist/pacman-contribution-graph-dark.svg?palette=github-dark
            dist/pacman-contribution-graph.svg?palette=github&color_snake=orange
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
